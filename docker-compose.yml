version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: devtalenty-api
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=DevTalenty AI Extractor
      - APP_VERSION=0.1.0
      - DEBUG=false
      - ENVIRONMENT=production
      - HOST=0.0.0.0
      - PORT=8000
      - CORS_ORIGINS=["*"]
      # Database Connection
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/devtalenty
      # LLM Provider Configuration
      - OPENAI_BASE_URL=https://api.groq.com/openai/v1
      - OPENAI_API_KEY=${OPENAI_API_KEY}  # Will be read from local environment or .env
      - OPENAI_MODEL=llama-3.1-8b-instant
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend-network

  db:
    image: postgres:15-alpine
    container_name: devtalenty-db
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=devtalenty
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d devtalenty"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - backend-network

volumes:
  postgres_data:

networks:
  backend-network:
    driver: bridge
